# Render Blueprint – GetMyPair API
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: getmypair-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Phone OTP SMS for APK / real devices. Dummy OTP popup is for local/Chrome only.
      - key: USE_MSG91_SMS
        value: "true"
