# Render Blueprint – GetMyPair API
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: getmypair-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Login code via MSG91 Flow SMS (not SendOTP). Dummy OTP popup is local/Chrome only.
      - key: USE_MSG91_SMS
        value: "true"
      # Set these in the Render dashboard (do not commit secrets):
      # MSG91_AUTH_KEY, MSG91_FLOW_ID (SMS template with ##number##)
      # MSG91_OTP_VAR=number  (optional MSG91_SENDER_ID)
      - key: MSG91_OTP_VAR
        value: number
